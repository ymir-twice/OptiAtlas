[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optiatlas"
version = "0.1.0"
description = "OptiAtlas optical image generation, policy training, and evaluation"
requires-python = ">=3.11"
dependencies = ["hydra-core>=1.3.2,<1.4", "Pillow>=10", "numpy>=1.26", "requests>=2.31", "httpx>=0.27", "tqdm>=4.67", "qwen-agent==0.0.34"]

[project.scripts]
optiatlas = "optiatlas.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["optiatlas*", "optics_agent*", "optics_agent_sft*", "optics_agent_rl*", "optics_experiments*", "draw_align_sft*", "engine*", "scripts*", "data*", "training_prompts*"]
exclude = ["vendor*", "tests*"]

[tool.setuptools.package-data]
optics_agent_rl = ["*.json", "configs/*.yaml"]
optics_agent_sft = ["*.json"]
"optics_agent.knowledge" = ["*.json"]
"draw_align_sft.upstream" = ["*.json"]
